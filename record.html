<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git sandbox: recording page</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&family=Source+Code+Pro:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_extensions/git-sandbox/resources/git-sandbox.css">
<style>
  /*
    A chrome-free page for screen recording. The box is the only thing on
    the page, its top edge never moves, and its total height never changes,
    so a recording frame set once stays framed.
  */
  body {
    font-family: "Open Sans", system-ui, sans-serif;
    background: #FFFFFF;
    margin: 0;
    padding: 24px;
  }
  .git-sandbox { max-width: 980px; margin: 0 auto; }

  /* The terminal is already a fixed 340px. These pin the two parts that
     normally grow or shrink with their content. */

  /* Every tab panel gets the same fixed height and scrolls inside it, so
     switching tabs or a growing diff never changes the box's height. */
  .gs-panel:not([hidden]) { height: 380px; overflow-y: auto; }
  .gs-diff, .gs-graph-scroll { max-height: none; }

  /* Reserve room for the done-note up front, so completing the last task
     does not push the panels down. Tune to your checklist's size. */
  .gs-tasks:not(:empty) { min-height: 230px; }
</style>
</head>
<body>

<div class="git-sandbox" id="anatomy">
  <div class="gs-loading">Loading the Git sandbox…</div>
</div>

<script src="_extensions/git-sandbox/resources/isomorphic-git.bundle.js"></script>
<script src="_extensions/git-sandbox/resources/git-sandbox.js"></script>
<script>
GitSandboxUI.mount('#anatomy', {
  title: 'A tour of the git box',
  prompt: '~/demo-project $',
  intro: [
    'This repository already has two commits. Run a few commands and watch',
    'the panels below; every one of them updates after each command.',
    'Type {y}help{/} to see what the sandbox supports.'
  ],
  hints: ['git status', 'git log --oneline', 'echo "A new line." >> README.md', 'git diff', 'git add .', 'git commit -m "Extend the README"'],
  doneNote: 'That is the whole feedback loop. Every command updates every panel. Your lessons ride on top of it.',
  seed: [
    'git init',
    'echo "# Demo project" > README.md',
    'git add .',
    'git commit -m "Add the README"',
    'echo "library(tidyverse)" > analysis.R',
    'git add .',
    'git commit -m "Start the analysis"'
  ].join('\n'),
  tasks: [
    { text: 'Ask where things stand with <code>git status</code>',
      when: 'ran /^\\s*git\\s+status/' },
    { text: 'Change a file and find it in the Changes panel',
      when: 'not clean' },
    { text: 'Stage it and watch it move to the staging area in the diagram',
      when: 'staged' },
    { text: 'Commit it and watch the history graph grow',
      when: 'commits >= 3' }
  ]
});
</script>

</body>
</html>
